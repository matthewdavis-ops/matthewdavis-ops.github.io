<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title }} — Matthew A. Davis</title>
{% assign desc = page.description | default: site.description | strip_html | strip_newlines %}<meta name="description" content="{{ desc | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:site_name" content="Matthew A. Davis">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ desc | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.image %}<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="{{ page.image | absolute_url }}">
<meta property="og:image:alt" content="{{ page.image_alt | default: page.title | escape }}">
<meta name="twitter:image" content="{{ page.image | absolute_url }}">
<meta name="twitter:image:alt" content="{{ page.image_alt | default: page.title | escape }}">
{% else %}<meta name="twitter:card" content="summary">
<meta property="og:image" content="https://matthewdavis-ops.github.io/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<meta property="og:image:alt" content="Portrait of Matthew A. Davis">
<meta name="twitter:image" content="https://matthewdavis-ops.github.io/og-image.jpg">{% endif %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d3345'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='32' font-weight='700' fill='%23d6a24d' text-anchor='middle'%3EMD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="alternate" type="application/atom+xml" title="Matthew A. Davis — Blog" href="/blog/feed.xml">
