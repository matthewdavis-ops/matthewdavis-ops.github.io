<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cave — DatMavis.com</title>
<meta name="description" content="A cave under the house. DatMavis.com by Matthew A. Davis.">
<link rel="canonical" href="https://matthewdavis-ops.github.io/web/datmavis/batcave/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d3345'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='32' font-weight='700' fill='%23d6a24d' text-anchor='middle'%3EMD%3C/text%3E%3C/svg%3E">
<style>
  /* Black everywhere, the screen centred, nothing else on the page. */
  html, body { margin: 0; background: #000000; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
  /* A doctype puts the page in standards mode, where an image in a table
     cell sits on the text baseline and leaves a gap under every slice.
     Block images close the gaps exactly as the original quirks-mode pages did. */
  #stage table { border-collapse: collapse; }
  #stage td img { display: block; border: 0; }
  #stage a { display: block; }
</style>
</head>
<body>
<div id="stage">
<!-- Save for Web Slices (Cave.psd) -->
<table id="Table_01" width="1500" height="1004" border="0" cellpadding="0" cellspacing="0">
	<tr>
		<td>
			<a href="../home/index.html" data-back="home"><img src="images/Back.gif" width="141" height="93" alt="Home"></a></td>
		<td rowspan="2">
			<img src="images/WordsSide.gif" width="393" height="1004" alt="As a symbol, I can be incorruptible. I can be everlasting…"></td>
		<td rowspan="2">
			<a href="../batcave/1/index.html" data-carry="1"><img data-hover="images/EnterUP.gif" src="images/Enterdown.gif" width="153" height="1004" alt="Here: into the Batcave"></a></td>
		<td rowspan="2">
			<img src="images/BatSide.gif" width="345" height="1004" alt=""></td>
		<td rowspan="2">
			<img src="images/RightSide.gif" width="468" height="1004" alt=""></td>
	</tr>
	<tr>
		<td>
			<img src="images/LeftSide.gif" width="141" height="911" alt=""></td>
	</tr>
</table>
<!-- End Save for Web Slices -->
</div>
<script>
  var DM_BASE = '../';
  // Where the visitor came from travels in the address, so one page can have
  // many ways in and its back arrow still returns to the right place.
  //   from = home|1-4        which Home page they started on
  //   via  = 1-3             which Instructions page (Superhero Shoes only)
  //   ret  = jupiter|europa|io  which page sent them to Frank / Discovery / Full of Stars
  // Every value is checked against a fixed list; anything else is ignored and the
  // arrow falls back to its default. DM_BASE = this page's path up to web/datmavis/.
  (function () {
    var BASE = window.DM_BASE || '../../';
    var RET = { jupiter: 'planets/jupiter/', europa: 'planets/europa/', io: 'planets/io/' };
    var q = new URLSearchParams(location.search);
    var from = q.get('from'), via = q.get('via'), ret = q.get('ret');
    if (!/^(home|[1-4])$/.test(from || '')) from = null;
    if (!/^[1-3]$/.test(via || '')) via = null;
    if (!RET.hasOwnProperty(ret || '')) ret = null;
    function home() { return BASE + 'home/' + (from && from !== 'home' ? from + '/' : '') + 'index.html'; }
    function query(r) {
      var p = [];
      if (from) p.push('from=' + from);
      if (r) p.push('ret=' + r);
      return p;
    }
    var links = document.querySelectorAll('a[data-carry], a[data-back]');
    for (var i = 0; i < links.length; i++) {
      var a = links[i], back = a.getAttribute('data-back'), href = a.getAttribute('href'), p;
      if (back === 'home') {
        if (from) href = home();
        a.setAttribute('href', href); continue;
      }
      if (back === 'ret') {
        if (ret) href = BASE + RET[ret] + 'index.html';
        else if (a.getAttribute('data-fallback') === 'home') { if (from) href = home(); a.setAttribute('href', href); continue; }
        p = query(null);
      } else if (back === 'instructions') {
        href = '../' + (via || '1') + '/index.html';
        p = query(null);
      } else {
        // a door: pass the notes along; data-ret names this page as the way back
        p = query(a.getAttribute('data-ret') || ret);
        if (a.getAttribute('data-via')) p.push('via=' + a.getAttribute('data-via'));
      }
      if (p.length) href += '?' + p.join('&');
      a.setAttribute('href', href);
    }
  })();

  // Rollovers: every slice with a drawn hover state swaps on mouse-over,
  // and on keyboard focus of its link. Hover states are preloaded.
  (function () {
    var imgs = document.querySelectorAll('img[data-hover]');
    for (var i = 0; i < imgs.length; i++) {
      (function (img) {
        var off = img.getAttribute('src'), on = img.getAttribute('data-hover');
        new Image().src = on;
        var a = img.parentNode.tagName === 'A' ? img.parentNode : img;
        a.addEventListener('mouseover', function () { img.src = on; });
        a.addEventListener('mouseout',  function () { img.src = off; });
        a.addEventListener('focus',     function () { img.src = on; });
        a.addEventListener('blur',      function () { img.src = off; });
      })(imgs[i]);
    }
  })();
  // Phones and small windows: shrink the whole screen to fit, never reflow it.
  // clientWidth/Height = the layout viewport (a phone's innerWidth reports the
  // zoomed-out screen and would never shrink). Screens up to 800px tall fit
  // the window both ways; taller pages fit the width and scroll.
  (function () {
    var stage = document.getElementById('stage'), W = 1500, H = 1004;
    function fit() {
      var root = document.documentElement;
      var s = Math.min(1, root.clientWidth / W);
      if (H <= 800) s = Math.min(s, root.clientHeight / H);
      if (s > 0.97) s = 1;   // a few pixels of scroll beats resampling the pixel art
      stage.style.zoom = s;
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
