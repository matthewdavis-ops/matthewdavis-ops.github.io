  var i = 0, mode = 'stopped', want = false;   // want: a play was asked for and is still starting

  list.alt = tracks.length ? 'Tracks: ' + tracks.map(function (t, n) { return (n + 1) + '. ' + t.title; }).join(', ') : 'Track list';

  function label() {
    var t = tracks[i];
    document.title = (t ? (mode === 'playing' ? '\u25B6 ' : '') + t.title + ' \u2014 ' : '') + A.title + ' \u00B7 ' + A.artist + ' \u00B7 DatMavis Juke Box';
    if (t && 'mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: A.artist, album: A.title,

  // Button art: hover lights a button; the current mode (play / pause / stop)
  // stays lit so you can see what the juke box is doing.
  var btns = {};
  document.querySelectorAll('.pb').forEach(function (a) {
    var img = a.querySelector('img'), act = a.getAttribute('data-act'); btns[act] = img;
    a.addEventListener('mouseenter', function () { img.src = img.getAttribute('data-up'); });
    a.addEventListener('mouseleave', paint);
    a.addEventListener('click', function (e) { e.preventDefault(); act === 'previous' ? prev() : act === 'next' ? next() : window[act](); });
    new Image().src = img.getAttribute('data-up');
  });
  function paint() {
    for (var k in btns) btns[k].src = btns[k].getAttribute(k === { playing: 'play', paused: 'pause', stopped: 'stop' }[mode] ? 'data-up' : 'data-down');
  }
  function load(n) { i = (n + tracks.length) % tracks.length; audio.src = tracks[i].src; label(); }

    if (!tracks.length) return;
