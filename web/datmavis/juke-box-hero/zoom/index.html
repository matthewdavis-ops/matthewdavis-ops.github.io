<script>
  // A card opens the player in its own little window, sized to the player
  // (phones turn it into a new tab). One window: picking another card swaps
  // the album in it rather than opening a second player.
  document.querySelectorAll('a[data-player]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var w = window.open(a.href, 'dmjukebox', 'popup,width=640,height=424');
      if (w) { w.focus(); } else { window.open(a.href, '_blank'); }
    });
  });
</script>
