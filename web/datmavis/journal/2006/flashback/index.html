		<td colspan="3" rowspan="8">
			<img src="images/Information.gif" width="406" height="262" alt="A bit of a pre-cursor before you wander off into the weird and wild world that is the mind of one, Joshua Neal Dalton. I met Josh while working at Poor Richards, up-town, in the year of 2005. We both started kayaking at around the same time, and of course both of us having a love for adventure we instantly hit it off. So, while I was getting my start in cheesy bands and cheesy artwork he was filming and coming out with cheesy videos of our adventures entitled Flashback Productions. Also, around the same time we started a kayaking club called Devils Face Paddling Club, which honestly wasn&#x27;t anything more than us just boating around and goofing off. But it did give me an excuse to make super cheesy photoshops of us and our exploits, acting all cool."></td>
