			<img src="images/Information.gif" width="299" height="384" alt="Tomorrow’s Space Suit. The public wants authentic style. It wants fine tailoring. It wants fabrics that will hold up to a speeding bullet, or the random exploding Nebula. The public wants the X-7. If the English Cut and the Italian Cut are daring, the X-7 is a lap around Monte Carlo in the fastest race car you can buy, borrow, or steal. Its roomy waist, and overall boxy look, makes the X-7 the perfect casual wear space suit, while still having that formal flair. This lends itself to both an image of power, and the impression that you know fashion. If this classic feels familiar, it should. Karman Lines has been making space suits for over 500 years. With a 99.97% no failure guarantee. (Not including Pool Party incidents.) So for your next romp through all of time and space think: X-7. The space suit of tomorrow, today…"></td>
