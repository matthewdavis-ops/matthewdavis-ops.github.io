<style>
  /* Black everywhere, the screen centred, nothing else on the page. */
  html, body { margin: 0; background: #000000; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
  /* A doctype puts the page in standards mode, where an image in a table
     cell sits on the text baseline and leaves a gap under every slice.
     Block images close the gaps exactly as the original quirks-mode pages did. */
  #Table_01 td img { display: block; border: 0; }
  #Table_01 a { display: block; }
</style>
</head>
<body>

</div>
<script>
  // Rollovers: every slice with a drawn hover state swaps on mouse-over,
  // and on keyboard focus of its link. Hover states are preloaded.
  (function () {
    var imgs = document.querySelectorAll('img[data-hover]');
    for (var i = 0; i < imgs.length; i++) {
      (function (img) {
        var off = img.getAttribute('src'), on = img.getAttribute('data-hover');
        new Image().src = on;
        var a = img.parentNode.tagName === 'A' ? img.parentNode : img;
        a.addEventListener('mouseover', function () { img.src = on; });
        a.addEventListener('mouseout',  function () { img.src = off; });
        a.addEventListener('focus',     function () { img.src = on; });
        a.addEventListener('blur',      function () { img.src = off; });
      })(imgs[i]);
    }
  })();
  // Phones and small windows: shrink the whole screen to fit, never reflow it.
  // clientWidth/Height = the layout viewport (a phone's innerWidth reports the
  // zoomed-out screen and would never shrink). Screens up to 720px tall fit
  // the window both ways; taller pages fit the width and scroll.
  (function () {
    var stage = document.getElementById('stage'), W = 1201, H = 540;
    function fit() {
      var root = document.documentElement;
      var s = Math.min(1, root.clientWidth / W);
      if (H <= 720) s = Math.min(s, root.clientHeight / H);
      stage.style.zoom = s;
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
