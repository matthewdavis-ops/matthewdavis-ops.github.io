# Pages CMS: what the editor at app.pagescms.org shows for this site.
media:
  input: img/blog
  output: /img/blog
content:
  - name: posts
    label: Blog
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, published]
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: description
        label: Summary (shows under the title on the Blog page)
        type: text
      - name: image
        label: Social image (link previews; JPG or PNG, 1200 × 630 works best)
        type: image
        options:
          extensions: [jpg, jpeg, png]
      - name: image_alt
        label: Social image alt text (describe the image for someone who can't see it)
        type: string
      - name: published
        label: Published
        type: boolean
        default: true
      - name: body
        label: Body
        type: rich-text
